<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Lighting Gradients -->
    <!-- Ribbon Outer Left -->
    <linearGradient id="inf-grad-1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Ribbon Apex & Right Fold -->
    <linearGradient id="inf-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <!-- Crossbar Infinity Twist (Overlapping Underneath) -->
    <linearGradient id="inf-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Deep Ambient Occlusion Shadow for Realistic Folding -->
    <filter id="drop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#ffffff" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Deep Obsidian Icon Canvas -->
  <rect width="512" height="512" rx="120" fill="#090a10" />
  <rect width="510" height="510" x="1" y="1" rx="119" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2" />

  <!-- The Immortal Infinity Chevron "A" Mark -->
  <g filter="url(#drop-glow)" transform="translate(0, 8)">
    <!-- Back Loop Shadow (Gives True Ribbon Intertwining Depth) -->
    <path d="M 160,340 C 210,310 240,270 256,230 C 272,270 302,310 352,340 C 370,350 380,365 372,385 C 362,405 338,405 316,385 C 290,360 270,320 256,290 C 242,320 222,360 196,385 C 174,405 150,405 140,385 C 132,365 142,350 160,340 Z" 
          fill="#0f172a" opacity="0.6" />

    <!-- 1. The Infinity Crossbar Loop (Twisting continuous fold) -->
    <path d="M 148,360 
             C 180,340 220,300 256,250 
             C 292,300 332,340 364,360 
             C 390,376 414,354 398,328 
             C 376,294 330,230 290,200 
             L 256,236 
             L 222,200 
             C 182,230 136,294 114,328 
             C 98,354 122,376 148,360 Z" 
          fill="url(#inf-grad-3)" />

    <!-- 2. The Left Ascending Blade (Rising from bottom-left to Apex) -->
    <path d="M 104,390 
             L 216,110 
             C 230,76 282,76 296,110 
             L 256,150 
             L 164,374 
             C 152,404 116,420 104,390 Z" 
          fill="url(#inf-grad-1)" />

    <!-- 3. The Right Descending Blade (Overlapping ribbon down to bottom-right) -->
    <path d="M 256,86 
             C 272,86 286,96 296,110 
             L 408,390 
             C 420,420 384,404 372,374 
             L 280,150 
             L 256,86 Z" 
          fill="url(#inf-grad-2)" />

    <!-- 4. Top Apex Bevel Fold (The Precision VS Code Ribbon Facet) -->
    <path d="M 216,110 L 256,86 L 296,110 L 256,150 Z" 
          fill="#ffffff" />

    <!-- Specular Light Reflection Lines along the edges -->
    <path d="M 104,390 L 216,110 L 256,86 L 296,110 L 408,390" 
          fill="none" 
          stroke="rgba(255,255,255,0.7)" 
          stroke-width="3" 
          stroke-linecap="round" />

    <path d="M 164,374 L 256,150 L 372,374" 
          fill="none" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="2" 
          stroke-linecap="round" />

    <!-- Center Floating Focal Point (Clean Minimalist Core) -->
    <circle cx="256" cy="245" r="8" fill="#ffffff" />
  </g>
</svg>
